name: Sync Upstream

on:
  schedule:
    # Run daily at UTC 02:00 (Beijing 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/handsomestWei/patent-disclosure-skill.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse origin/main)
          echo "upstream_sha=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "local_sha=$LOCAL" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Upstream has new commits."
          fi

      - name: Merge upstream (keep our changes on conflict)
        id: merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Strategy: -X ours keeps our modifications when files conflict
          # This handles content conflicts automatically
          if git merge upstream/main -X ours --no-edit; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "Merge succeeded (no conflict or auto-resolved with ours strategy)."
          else
            # modify/delete conflict: upstream deleted a file we modified
            # Solution: keep our version of all conflicted files
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "Merge has modify/delete conflicts, resolving by keeping our version."
            git checkout --ours .
            git add -A
            git commit --no-edit
          fi

      - name: Push to main
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          git push origin main

      - name: Push resolved merge to main
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success == 'false'
        run: |
          git push origin main

      - name: Summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "Sync complete. Upstream changes merged with ours strategy."
          echo "Our modifications (search rewrite, new sub-skills, MCP integration) are preserved."
          echo "New upstream files (bug fixes, new features) are accepted."
