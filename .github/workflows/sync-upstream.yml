name: Sync Upstream

on:
  schedule:
    # Run daily at UTC 02:00 (Beijing 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/handsomestWei/patent-disclosure-skill.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse origin/main)
          echo "upstream_sha=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "local_sha=$LOCAL" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Upstream has new commits."
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/main --no-edit; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "Merge succeeded, will push directly."
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "Merge conflict detected, will create PR."
            git merge --abort
          fi

      - name: Push (no conflict)
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          git push origin main

      - name: Create PR (conflict)
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success == 'false'
        run: |
          BRANCH="sync-upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit || true
          git add -A
          git commit -m "sync: merge upstream (conflicts need review)" || true
          git push origin "$BRANCH"
          # Create label if not exists
          gh label create "sync-upstream" --color "1f883d" --description "Auto-sync from upstream" 2>/dev/null || true
          # Create PR
          gh pr create \
            --title "Sync upstream: new commits from handsomestWei/patent-disclosure-skill" \
            --body "## Upstream has new updates

          The upstream repository has new commits that conflict with this fork's modifications.

          ### What needs manual review
          Please review the conflicted files, resolve conflicts, then merge this PR.

          **Conflict reason**: This repo modified upstream files (search layer rewrite, new sub-skills, etc.) which now conflict with upstream changes.

          ### Suggested resolution
          - For files this repo already modified (e.g. \`skills/patent-search/\`): keep this repo's version
          - For new files added by upstream: accept upstream's version
          - Resolve conflicts and merge this PR

          ---
          *This PR was auto-created by GitHub Actions*" \
            --base main \
            --head "$BRANCH" \
            --label "sync-upstream"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
